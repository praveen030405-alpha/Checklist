plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boss.progresschecklist'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boss.progresschecklist'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        debug {
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
